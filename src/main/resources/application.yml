spring:
  # 레디스 추가
  data:
    redis:
      host: redis
      port: 6379

  application:
    name: hub-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:hub-db}:${DB_PORT:5432}/${DB_NAME:logilink_hub}
#    url: jdbc:postgresql://localhost:5436/logilink_hub
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 19096

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:19090/eureka
    instance:
      hostname: hub-service
      prefer-ip-address: true
      instance-id: ${spring.application.name}:${random.value}


logging:
  level:
    com.logilink: INFO
    org.springframework.cloud: WARN